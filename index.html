<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK AI Network - Premium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: linear-gradient(135deg, #1e1b4b, #311042); padding: 15px; text-align: center; border-bottom: 2px solid #4338ca; position: relative; }
        header h1 { font-size: 18px; font-weight: bold; color: #818cf8; text-shadow: 0 0 10px rgba(99,102,241,0.5); }
        .limit-badge { position: absolute; right: 15px; top: 15px; background: #1f2937; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; color: #f43f5e; border: 1px solid #f43f5e; }
        .agent-selector { display: flex; justify-content: space-around; background-color: #111827; padding: 10px; border-bottom: 1px solid #1f2937; }
        .agent-btn { background: #1f2937; border: 1px solid #374151; color: #9ca3af; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.3s; }
        .agent-btn.active { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border-color: #818cf8; box-shadow: 0 0 12px rgba(124,58,237,0.4); }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at top, #111827 0%, #060911 100%); }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
        .message.user { background: #312e81; color: #e0e7ff; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #4338ca; }
        .message.ai { background: #1f2937; color: #f3f4f6; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #374151; white-space: pre-wrap; }
        .message.system { background: transparent; color: #4b5563; font-size: 12px; align-self: center; text-align: center; }
        .input-area { background-color: #111827; padding: 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #1f2937; }
        .input-wrapper { flex: 1; background: #1f2937; border: 1px solid #374151; border-radius: 25px; display: flex; align-items: center; padding: 5px 15px; }
        input { flex: 1; background: transparent; border: none; color: #f3f4f6; height: 35px; font-size: 15px; outline: none; }
        .send-btn { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .paywall-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 9, 17, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; z-index: 9999; }
        .paywall-card { background: #111827; border: 2px solid #6366f1; border-radius: 24px; padding: 40px 25px; max-width: 400px; box-shadow: 0 0 30px rgba(99,102,241,0.3); }
        .paywall-title { font-size: 22px; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .paywall-text { color: #9ca3af; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .price { font-size: 28px; font-weight: 800; color: #818cf8; margin-bottom: 25px; }
        .pay-btn { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; border: none; padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>MSK AI NETWORK</h1>
        <div class="limit-badge" id="limitBadge">Лимит: 3/3</div>
    </header>
    <div class="agent-selector">
        <button class="agent-btn active" onclick="setAgent('lawyer', event)">⚖️ Юрист</button>
        <button class="agent-btn" onclick="setAgent('search', event)">🔍 Поиск</button>
        <button class="agent-btn" onclick="setAgent('wb', event)">📦 Модуль WB</button>
    </div>
    <div class="chat-container" id="chatBox">
        <div class="message system">Система готова. Вам доступно 3 бесплатных премиум-запроса.</div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Задайте вопрос ИИ..." onkeypress="if(event.key==='Enter') sendMessage()">
        </div>
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>
    <div class="paywall-overlay" id="paywall">
        <div class="paywall-card">
            <div class="paywall-title">👑 Лимит исчерпан</div>
            <div class="paywall-text">Вы использовали все бесплатные запросы. Оформите Premium-доступ, чтобы открыть безлимитный доступ к Высшему ИИ-Юристу, Поиску и бизнес-аналитике Wildberries.</div>
            <div class="price">1 990 ₽ / месяц</div>
            <button class="pay-btn" onclick="alert('В следующем шаге мы настроим реальный приём платежей сюда!')">Активировать доступ</button>
        </div>
    </div>
    <script>
        let currentAgent = 'lawyer';
        let freeRequestsLeft = 3;
        let chatHistory = [];
        const prompts = {
            lawyer: "Ты — Высший Цифровой Юрист РФ компании MSK AI Network. Отвечай строго по законам РФ со ссылками на кодексы.",
            search: "Ты — Умный ИИ-Поисковик сети MSK AI Network. Давай точную выжимку фактов.",
            wb: "Ты — Аналитик Wildberries команды MSK AI Network. Делай SEO-оптимизацию карточек и поднимай продажи."
        };
        
        function setAgent(agent, event) {
            currentAgent = agent;
            document.querySelectorAll('.agent-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            chatHistory = []; 
        }
        
        async function sendMessage() {
            if (freeRequestsLeft <= 0) { document.getElementById('paywall').style.display = 'flex'; return; }
            let inputEl = document.getElementById('userInput');
            let text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = '';
            
            let chatBox = document.getElementById('chatBox');
            let userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = text;
            chatBox.appendChild(userMsg);
            
            freeRequestsLeft--;
            document.getElementById('limitBadge').innerText = `Лимит: ${freeRequestsLeft}/3`;
            
            let aiMsg = document.createElement('div');
            aiMsg.className = 'message ai';
            aiMsg.innerText = 'ИИ думает...';
            chatBox.appendChild(aiMsg);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            chatHistory.push({ role: "user", content: text });
            
            try {
                // Новая рабочая схема: отправляем системный промпт и контекст через открытый шлюз
                const systemContext = prompts[currentAgent];
                const fullQuery = `Контекст роли: ${systemContext}\n\nИстория диалога: ${JSON.stringify(chatHistory)}\n\nНовый вопрос пользователя: ${text}`;
                
                let response = await fetch(`https://pollinations.ai{encodeURIComponent(fullQuery)}`);
                
                if (!response.ok) throw new Error('Ошибка шлюза');
                
                let aiText = await response.text();
                aiMsg.innerText = aiText;
                chatHistory.push({ role: "assistant", content: aiText });
            } catch (e) { 
                aiMsg.innerText = 'Ошибка сети. Шлюз перегружен, попробуйте еще раз.'; 
                console.error(e);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
