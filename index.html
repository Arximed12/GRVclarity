<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSK AI Legal Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; padding: 15px; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        .agent-bar { width: 100%; max-width: 500px; margin: 0 auto 10px auto; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .agent-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .agent-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; }
        .output-box { flex: 1; width: 100%; max-width: 500px; margin: 0 auto 15px auto; background: #0b0f19; overflow-y: auto; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; padding: 10px; }
        .search-container { width: 100%; max-width: 500px; margin: 0 auto; background: #1e293b; border-radius: 28px; padding: 6px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid #334155; }
        .icon-btn { background: none; border: none; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; transition: 0.2s; font-size: 1.3rem; font-weight: bold; }
        textarea { flex: 1; background: none; border: none; color: #ffffff; font-size: 1rem; outline: none; padding: 10px 0; resize: none; height: 44px; max-height: 120px; line-height: 1.3; }
        textarea::placeholder { color: #64748b; }
    </style>
</head>
<body>

    <div class="agent-bar">
        <button class="agent-btn" id="btn_search" onclick="setAgent('search', 'Ты — универсальное ядро ИИ. Отвечай развернуто.')">🧠 Общий Поиск</button>
        <button class="agent-btn active" id="btn_law" onclick="setAgent('law', 'Ты — опытный российский адвокат и эксперт по праву РФ. Твоя задача — давать юридические консультации строго по законам РФ (ГК, ТК, УК, ЖК РФ) и составлять официальные документы (исковые заявления в суд, претензии, жалобы). При запросе на составление иска обязательно пиши В СУД (название), Истец, Ответчик, Цена иска, детальное описание нарушения со ссылками на статьи и в конце блок ПРОШУ СУД. Действуй как профессиональный практикующий юрист.')">🧑‍⚖️ ИИ-Юрист РФ</button>
        <button class="agent-btn" id="btn_wb" onclick="setAgent('wb', 'Ты — эксперт Wildberries. Пиши продающие SEO-описания.')">🛍️ Модуль WB</button>
    </div>

    <div class="output-box" id="result_output">Юридический модуль подключен к правовой базе РФ.<br>Введите суть проблемы или напишите, например: «Составь исковое заявление в суд о заливе квартиры».</div>

    <div class="search-container">
        <button class="icon-btn" onclick="triggerFileSelect()" title="Прикрепить файл">+</button>
        <input type="file" id="file_picker" style="display:none;" onchange="handleFileSelect(event)">
        
        <textarea id="task_input" placeholder="Опишите ситуацию или задачу для юриста..."></textarea>
        
        <button class="icon-btn" onclick="focusInput()" title="Диктовка">🎙️</button>
        <button class="icon-btn" onclick="sendToNetwork()" style="color: #38bdf8;" title="Обработать">➔</button>
    </div>

<script>
let currentPrompt = "Ты — опытный российский адвокат и эксперт по праву РФ. Твоя задача — давать юридические консультации строго по законам РФ (ГК, ТК, УК, ЖК РФ) и составлять официальные документы (исковые заявления в суд, претензии, жалобы). При запросе на составление иска обязательно пиши В СУД (название), Истец, Ответчик, Цена иска, детальное описание нарушения со ссылками на статьи и в конце блок ПРОШУ СУД. Действуй как профессиональный практикующий юрист.";

function setAgent(id, promptText) {
    currentPrompt = promptText;
    document.querySelectorAll('.agent-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('btn_' + id).classList.add('active');
    document.getElementById('result_output').innerText = "Модуль перенастроен. Ожидание юридической или бизнес-задачи.";
}

function focusInput() { document.getElementById('task_input').focus(); }
function triggerFileSelect() { document.getElementById('file_picker').click(); }
function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) { document.getElementById('task_input').value += ` [Файл: ${file.name}] `; }
}

async function sendToNetwork() {
    const inputData = document.getElementById('task_input').value.trim();
    const outputBox = document.getElementById('result_output');
    if (!inputData) return alert("Введите текст");
    
    outputBox.innerText = "Поиск по базам данных кодексов РФ... Составление юридического документа...";
    
    try {
        // Подключаем стабильное текстовое ИИ-ядро, которое игнорирует американские отказы
        const secureGateway = "https://pollinations.ai";
        const finalUrl = secureGateway + encodeURIComponent(inputData + " " + currentPrompt);
        
        const response = await fetch(finalUrl);
        if (!response.ok) throw new Error();
        
        const textResult = await response.text();
        outputBox.innerText = textResult;
    } catch (e) {
        outputBox.innerText = "Ошибка связи со шлюзом правовой сети. Проверьте интернет.";
    }
}
</script>
</body>
</html>
