<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финальный Тест</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; padding: 40px; text-align: center; }
        .box { background: #111827; padding: 30px; border-radius: 16px; max-width: 500px; margin: 0 auto; border: 1px solid #1f2937; }
        button { background: #1a73e8; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #output { margin-top: 20px; padding: 15px; background: #1f2937; border-radius: 8px; color: #818cf8; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Проверка связи (Вариант без CORS)</h2>
        <br>
        <button onclick="test()">📡 Проверить мост данных</button>
        <div id="output">Нажмите кнопку...</div>
    </div>

    <script>
        async function test() {
            const out = document.getElementById('output');
            out.innerText = "Связываюсь с сервером Vercel...";
            try {
                // Переключаемся на неубиваемый GET-запрос без сложных заголовков
                const res = await fetch("https://msk-ai.vercel.app/");
                const text = await res.text();
                out.innerText = text;
            } catch (e) {
                out.innerText = "Ошибка: " + e.message;
            }
        }
    </script>
</body>
</html>
