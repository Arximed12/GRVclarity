<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK AI Network - Модуль Юрист</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            padding: 20px;
        }
        .app-card {
            background: radial-gradient(circle at top, #111827 0%, #060911 100%);
            padding: 40px 25px; 
            border-radius: 24px; 
            border: 2px solid #4338ca; 
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 30px rgba(99,102,241,0.3);
        }
        h1 { font-size: 24px; font-weight: bold; color: #818cf8; margin-bottom: 10px; }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        .input-wrapper {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            gap: 8px;
            margin-bottom: 20px;
        }
        input { flex: 1; background: transparent; border: none; color: #f3f4f6; height: 40px; font-size: 15px; outline: none; }
        
        .launch-btn { 
            background: linear-gradient(135deg, #4f46e5, #7c3aed); 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            border-radius: 50px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>MSK AI NETWORK</h1>
        <p>Введите ваш вопрос. Браузер сам создаст безопасный и чистый запрос к ИИ-Юристу.</p>
        
        <!-- Официальная железная форма поиска, которая отправляет данные на google.ru -->
        <form action="https://google.ru" method="GET" target="MSK_AI_Window" onsubmit="openCleanWindow()">
            
            <!-- Принудительно включаем русский язык и ИИ-режим (udm=50) -->
            <input type="hidden" name="hl" value="ru">
            <input type="hidden" name="udm" value="50">
            
            <div class="input-wrapper">
                <!-- Сюда пользователь пишет свой вопрос -->
                <input type="text" name="q" id="userQuery" placeholder="Опишите юридическую проблему..." required>
            </div>
            
            <button type="submit" class="launch-btn">⚖️ Консультация ИИ-Юриста</button>
        </form>
    </div>

    <script>
        function openCleanWindow() {
            // Добавляем к вопросу скрытый хвост-инструкцию, чтобы Google понял, что нужен Юрист
            const input = document.getElementById('userQuery');
            if (input && !input.value.includes("юрист")) {
                input.value = "юрист " + input.value + " по законам РФ статьи кодексов пошагово";
            }

            const width = 900;
            const height = 650;
            const left = (window.screen.width / 2) - (width / 2);
            const top = (window.screen.height / 2) - (height / 2);
            
            // Заранее открываем чистое окно без адресной строки. Форма сама загрузит туда Google!
            window.open(
                "about:blank", 
                "MSK_AI_Window", 
                `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes,status=no,toolbar=no,menubar=no,location=no`
            );
        }
    </script>
</body>
</html>
