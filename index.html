<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Связи: Чат</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .chat-box { background: #111827; padding: 20px; border-radius: 16px; width: 100%; max-width: 500px; border: 1px solid #1f2937; }
        #chat-window { height: 300px; overflow-y: auto; background: #060911; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #1f2937; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
        .user-msg { background: #1a73e8; color: white; margin-left: auto; text-align: right; }
        .server-msg { background: #1f2937; color: #818cf8; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; outline: none; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2>MSK AI — Модуль Юрист (Финальный тест связи)</h2>
    <br>
    
    <div class="chat-box">
        <div id="chat-window">
            <div class="msg server-msg">Система: Твоя ссылка Vercel вшита. Напишите текст и нажмите Отправить.</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="user-text" placeholder="Напишите что-нибудь..." onkeypress="if(event.key==='Enter') sendTestRequest()">
            <button onclick="sendTestRequest()">Отправить</button>
        </div>
    </div>

    <script>
        async function sendTestRequest() {
            const input = document.getElementById('user-text');
            const text = input.value.trim();
            if (!text) return;
            
            const windowDiv = document.getElementById('chat-window');
            
            const userDiv = document.createElement('div');
            userDiv.className = 'msg user-msg';
            userDiv.innerText = text;
            windowDiv.appendChild(userDiv);
            
            input.value = '';
            windowDiv.scrollTop = windowDiv.scrollHeight;
            
            const serverDiv = document.createElement('div');
            serverDiv.className = 'msg server-msg';
            serverDiv.innerText = "Отправка на твой Vercel...";
            windowDiv.appendChild(serverDiv);
            windowDiv.scrollTop = windowDiv.scrollHeight;
            
            try {
                // ТВОЯ ТОЧНАЯ ССЫЛКА НА ОБРАБОТЧИК С ЗАЩИТОЙ ОТ БЛОКИРОВОК БРАУЗЕРА
                const res = await fetch("https://msk-ai.vercel.app/", {
                    method: "GET",
                    mode: "cors"
                });
                const resultText = await res.text();
                
                serverDiv.innerText = "Твой Vercel ответил:\n" + resultText;
            } catch (e) {
                serverDiv.style.color = "#f43f5e";
                serverDiv.innerText = "Ошибка шлюза: " + e.message;
            }
            windowDiv.scrollTop = windowDiv.scrollHeight;
        }
    </script>
</body>
</html>
