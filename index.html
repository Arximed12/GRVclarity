<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MSK AI NETWORK</title>
    <!-- Подключаем наш общий файл стилей -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <h1>MSK AI NETWORK</h1>
        <div class="subtitle">👑 Премиальный ИИ-Ассистент</div>
        
        <!-- Категории, которые строго совпадают с кнопками в config.js -->
        <select id="aiRole" class="module-select">
            <option value="действуй строго по законам РФ как высококвалифицированный юрист." selected>⚖️ Юриспруденция и Защита прав</option>
            <option value="действуй как эксперт по маркетплейсам Wildberries, Ozon и Яндекс.Маркет.">📦 Маркетплейсы (WB, Ozon, Я.Маркет)</option>
            <option value="действуй как автоэксперт, мастер по подбору машин и специалист по автотехнике.">🚗 Автомобили и техника</option>
            <option value="действуй как профессиональный маркетолог, копирайтер и бизнес-консультант.">💼 Услуги и Бизнес</option>
        </select>

        <form action="https://google.ru" method="GET" target="_blank" id="aiForm" style="width: 100%;">
            <input type="hidden" name="hl" value="ru">
            <input type="hidden" name="udm" value="50">
            
            <div class="input-box">
                <input type="text" name="q" id="userQuery" placeholder="Опишите вашу проблему или выберите вопрос ниже..." required>
                <!-- 🔥 ДОБАВИЛИ КНОПКУ-ОТПРАВИТЕЛЬ С КРАЮ ПОЛЯ -->
                <button type="submit" class="send-mini-btn" title="Отправить запрос">➔</button>
            </div>
            
            <!-- Сюда наш движок теперь будет красиво выводить 4 кнопки с вопросами -->
            <div class="quick-buttons-grid" id="dynamic-buttons-container"></div>
        </form>
    </div>
    
    <!-- Подключаем внешние скрипты -->
    <script src="js/config.js"></script>
    <script src="js/logic.js"></script>
</body>
</html>
