<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест MSK AI</title>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .btn { background: #4f46e5; color: white; border: none; padding: 15px 30px; border-radius: 10px; cursor: pointer; font-size: 16px; margin: 10px; }
        .btn:hover { background: #7c3aed; }
        #status { margin-top: 20px; font-size: 18px; color: #818cf8; }
    </style>
</head>
<body>

    <h1>Тестовый режим MSK AI</h1>
    <p>Проверяем работу кнопок на GitHub Pages</p>

    <!-- Две простые кнопки для проверки -->
    <button class="btn" onclick="testClick('Кнопка Юрист работает!')">⚖️ Проверить Юриста</button>
    <button class="btn" onclick="testClick('Кнопка Поиск открывает Google...')">🔍 Проверить Поиск</button>

    <div id="status">Нажмите на любую кнопку...</div>

    <script>
        function testClick(message) {
            // Меняем текст на экране при клике
            document.getElementById('status').innerText = message;
            
            // Если нажали поиск, сразу пробуем открыть Google
            if (message.includes('Поиск')) {
                window.open('https://google.com', '_blank');
            }
        }
    </script>
</body>
</html>
