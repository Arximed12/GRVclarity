<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK AI Network - Модуль Юрист</title>
    
    <!-- Жесткая броня против зависания кэша на любых устройствах -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { 
            background-color: #0b0f19; 
            color: #f3f4f6; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            padding: 20px;
            overflow: hidden;
        }
        .app-card {
            background: radial-gradient(circle at top, #111827 0%, #060911 100%);
            padding: 40px 25px; 
            border-radius: 24px; 
            border: 2px solid #4338ca; 
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 30px rgba(99,102,241,0.3);
        }
        h1 { font-size: 24px; font-weight: bold; color: #818cf8; margin-bottom: 10px; text-shadow: 0 0 10px rgba(99,102,241,0.5); }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        .input-wrapper {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            gap: 8px;
            margin-bottom: 20px;
        }
        input { flex: 1; background: transparent; border: none; color: #f3f4f6; height: 40px; font-size: 15px; outline: none; }
        
        .mic-btn { background: none; border: none; color: #80868b; cursor: pointer; font-size: 18px; padding: 4px; display: flex; align-items: center; justify-content: center; outline: none; }
        .mic-btn.recording { color: #f43f5e; animation: pulse 1.5s infinite; }
        
        .launch-btn { 
            background: linear-gradient(135deg, #4f46e5, #7c3aed); 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            border-radius: 50px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(124,58,237,0.4);
            outline: none;
        }
        .launch-btn:hover { 
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(124,58,237,0.6);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-card">
        <h1>MSK AI NETWORK</h1>
        <p>Задайте вопрос текстом или голосом. Система автоматически откроет решение в изолированном ИИ-интерфейсе.</p>
        
        <div class="input-wrapper">
            <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Голосовой ввод">🎤</button>
            <input type="text" id="legalQuestion" placeholder="Введите ваш юридический вопрос..." onkeypress="if(event.key==='Enter') startAiLawyer()">
        </div>
        
        <button class="launch-btn" onclick="startAiLawyer()">⚖️ Консультация ИИ-Юриста</button>
    </div>

    <script>
        // --- ЛОГИКА РАБОТЫ МИКРОФОНА ---
        let recognition;
        let isRecording = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.onresult = (e) => { document.getElementById('legalQuestion').value = e.results[0].transcript; };
            recognition.onend = () => { isRecording = false; document.getElementById('micBtn').classList.remove('recording'); };
            recognition.onerror = () => { isRecording = false; document.getElementById('micBtn').classList.remove('recording'); };
        }
        function toggleVoice() {
            if (!recognition) return alert("Голосовой ввод недоступен на этом устройстве.");
            const btn = document.getElementById('micBtn');
            if (isRecording) {
                recognition.stop();
            } else {
                isRecording = true;
                btn.classList.add('recording');
                document.getElementById('legalQuestion').value = '';
                recognition.start();
            }
        }

        // --- УНИВЕРСАЛЬНЫЙ ИИ-ЗАПУСК (ПК + СМАРТФОН) ---
        function startAiLawyer() {
            let inputEl = document.getElementById('legalQuestion');
            let text = inputEl.value.trim();
            
            // Если поле пустое, ставим базовый промпт юриста
            if (!text) {
                text = "юрист консультация по законам РФ статьи кодексов пошагово";
            } else {
                // Добавляем жесткую юридическую инструкцию к вопросу пользователя
                text = text + " ответь как юрист по законам РФ со ссылками на статьи кодексов пошагово";
            }
            
            // Ссылка на чистый ИИ-режим Google (без лишних текстов и меню)
            const targetUrl = "https://google.com" + encodeURIComponent(text) + "&udm=50";
            
            // Проверяем: открыт ли сайт внутри телефона (MIT App Inventor WebView) или на ПК
            const isMobileApp = (navigator.userAgent.indexOf("Android") > -1) || (window.innerHeight < 400);
            
            if (isMobileApp) {
                // НА ТЕЛЕФОНЕ: Перенаправляем сам WebView приложения на полный экран без рамок
                window.location.href = targetUrl;
            } else {
                // НА КОМПЬЮТЕРЕ: Открываем премиальное изолированное мини-окно без адресной строки и вкладок
                const width = 900;
                const height = 650;
                const left = (window.screen.width / 2) - (width / 2);
                const top = (window.screen.height / 2) - (height / 2);
                
                window.open(
                    targetUrl, 
                    "MSK_AI_Premium_Lawyer", 
                    `width=${width},height=${height},top=${top},left=${left},resizable=yes,scrollbars=yes,status=no,toolbar=no,menubar=no,location=no`
                );
            }
        }
    </script>
</body>
</html>
