<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK AI Network - Разум Юриста</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
        
        body {
            background-color: #010019;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        .app-card {
            background: radial-gradient(circle at top, #111027 0%, #060511 100%);
            padding: 40px 25px;
            border-radius: 24px;
            border: 2px solid #4338ca;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            color: #ff9800;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        /* Стиль для выпадающего списка */
        .dropdown {
            width: 100%;
            background-color: #16152d;
            border: 1px solid #4338ca;
            border-radius: 12px;
            padding: 14px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
            cursor: pointer;
        }

        .dropdown optgroup {
            background-color: #060511;
            color: #8b949e;
            font-style: normal;
        }

        .dropdown option {
            background-color: #16152d;
            color: #ffffff;
            padding: 10px;
        }

        /* Поле ввода текста */
        .text-input {
            width: 100%;
            background-color: #16152d;
            border: 1px solid #4338ca;
            border-radius: 12px;
            padding: 14px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 15px;
            min-height: 80px;
            resize: none;
            outline: none;
        }

        /* СЕТКА ДЛЯ 4 ДИНАМИЧЕСКИХ КНОПОК */
        .quick-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-btn {
            background-color: #1a1936;
            border: 1px solid #312e81;
            border-radius: 12px;
            padding: 14px 12px;
            color: #f3f4f6;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quick-btn:hover {
            background-color: #23224d;
            border-color: #6366f1;
            transform: translateY(-1px);
        }

        /* Главная кнопка */
        .main-submit-btn {
            width: 100%;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .main-submit-btn:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

<div class="app-card">
    <div style="font-size: 22px; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px;">MSK AI NETWORK</div>
    <div class="subtitle">👑 Премиальный ИИ-Ассистент</div>

    <!-- ВАШ ИСХОДНЫЙ СПИСОК С ГРУППАМИ -->
    <select class="dropdown" id="main-select" onchange="updateQuickButtons()">
        <optgroup label="⚖️ Юриспруденция и Защита прав">
            <option value="legal-pretension" selected>🛡️ Досудебные претензии</option>
            <option value="legal-contracts">📄 Договоры и Расписки</option>
            <option value="legal-fines">🚨 Обжалование штрафов</option>
        </optgroup>
        <optgroup label="📦 Маркетплейсы (WB, Ozon, Я.Маркет)">
            <option value="mp-reviews">💬 Менеджер отзывов</option>
            <option value="mp-seo">🚀 SEO-оптимизатор карточек</option>
            <option value="mp-competitors">📊 Аналитик конкурентов</option>
            <option value="mp-rich">📝 Rich-контент</option>
        </optgroup>
        <optgroup label="🏎️ Автомобили и техника">
            <option value="auto-ads">🚘 Авто-объявления</option>
            <option value="auto-bargain">🧠 Торг и Переговоры</option>
            <option value="auto-parts">⚙️ Аналоги запчастей</option>
        </optgroup>
        <optgroup label="💼 Услуги и Бизнес">
            <option value="biz-avito">🔨 Объявления для Авито</option>
            <option value="biz-reels">🎬 Сценарии Reels/Shorts</option>
            <option value="biz-resume">👔 Резюме под HeadHunter</option>
        </optgroup>
    </select>

    <!-- Поле ввода (куда вставляется текст) -->
    <textarea class="text-input" placeholder="Опишите вашу проблему выбранному ИИ..." id="user-prompt"></textarea>

    <!-- МЕСТО ДЛЯ КНОПОК (Сюда JavaScript вставляет 4 кнопки) -->
    <div class="quick-buttons-grid" id="dynamic-buttons-container"></div>

    <!-- Главная кнопка отправки -->
    <button class="main-submit-btn">
        ➔ Консультация ИИ-Юриста
    </button>
</div>

<script>
// БАЗА ДАННЫХ КНОПОК ПОД КАЖДЫЙ ВАРИАНТ ВЫБОРА
const buttonsData = {

        { icon: '🛒', text: 'Вернуть товар' },
        { icon: '💼', text: 'Трудовой спор' }
    ],
    '📄 Договоры и Расписки': [
        { icon: '🔑', text: 'Аренда квартиры' },
        { icon: '🚘', text: 'Покупка машины' },
        { icon: '📝', text: 'Проверить риски' },

    ],
    '🚨 Обжалование штрафов': [
        { icon: '📸', text: 'Камера ГИБДД' },

        { icon: '🛑', text: 'Оспорить протокол' },

    ],
    '💬 Менеджер отзывов': [
        { icon: '⭐️', text: 'Ответ на 5 звезд' },
        { icon: '😡', text: 'Ответ на негатив' },
        { icon: '❓', text: 'Консультация клиента' },
        { icon: '🔥', text: 'Благодарность' }
    ],
    '🚀 SEO-оптимизатор карточек': [
        { icon: '📈', text: 'Собрать ключи' },
        { icon: '📝', text: 'Текст для Wildberries' },
        { icon: '🛍️', text: 'Описание для Ozon' },
        { icon: '🎯', text: 'Заголовок товара' }
    ],
    '📊 Аналитик конкурентов': [
        { icon: '🔎', text: 'Поиск слабых мест' },
        { icon: '💰', text: 'Анализ цен' },
        { icon: '📦', text: 'Объемы продаж' },

        { icon: '💵', text: 'Быстрая продажа' },
        { icon: '📋', text: 'Описание состояния' },

    ],
    '🧠 Торг и Переговоры': [
        { icon: '📉', text: 'Сбить цену продавца' },

    '⚙️ Аналоги запчастей': [
        { icon: '🔧', text: 'Поиск дубликатов' },

    ],
    '🔨 Объявления для Авито': [
        { icon: '🔧', text: 'Авито Услуги' },
        { icon: '🏠', text: 'Продажа личных вещей' },
        { icon: '🚀', text: 'Оптимизация просмотров' },

    ],
    '🎬 Сценарии Reels/Shorts': [
        { icon: ' hook', text: 'Яркое начало (Хук)' },

    ],
    '👔 Резюме под HeadHunter': [
        { icon: '💼', text: 'Опыт работы' },
        { icon: '🧠', text: 'Ключевые навыки' },
        { icon: '📝', text: 'Сопроводительное письмо' },
        { icon: '🚀', text: 'Повысить отклики' }
    ]
};

// ЛОГИКА ДИНАМИЧЕСКИХ КНОПОК
function updateQuickButtons() {
    const selectElement = document.getElementById('main-select');
    const container = document.getElementById('dynamic-buttons-container');
    
    // Берем точный текст выбранного пункта
    const selectedText = selectElement.options[selectElement.selectedIndex].text.trim();

    // Очищаем старые кнопки
    container.innerHTML = '';

    // Подтягиваем новые кнопки из базы данных
    const currentButtons = buttonsData[selectedText] || [];

    // Создаем кнопки на лету
    currentButtons.forEach(buttonInfo => {
        const button = document.createElement('button');
        button.className = 'quick-btn';
        button.innerHTML = `<span>${buttonInfo.icon}</span> ${buttonInfo.text}`;
        
        // Клик по кнопке вставляет её текст в поле ввода
        button.onclick = function() {
            document.getElementById('user-prompt').value = buttonInfo.text;
        };

        container.appendChild(button);
    });
}

// Запуск логики сразу при загрузке плагина
document.addEventListener("DOMContentLoaded", function() {
    updateQuickButtons();
});
</script>

</body>
</html>
