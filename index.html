<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GRVclarity - ИИ Ассистент</title>
    <!-- Жесткая коммерческая маскировка: наглухо убирает серые кнопки плюс-минус и лупу масштабирования на телефонах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Подключаем наш общий премиальный файл стилей бренда GRV -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- ВЕРХНЯЯ СЛУЖЕБНАЯ ПАНЕЛЬ СЕТИ GRV -->
        <div class="top-status-bar">
            <div class="network-status" id="netStatus" title="Статус сети: Проверка подключения...">
                <!-- Сюда наш монолитный logic.js выведет красивый зеленый или красный неоновый огонек -->
                <span class="status-dotIndicator yellow"></span>
                <span class="status-textLabel">Сеть</span>
            </div>
            <!-- Наша кнопка баланса (id строго совпадает с элементами в logic.js) -->
            <button class="balance-badge" id="openWalletBtn">👛 0 ₽</button>
        </div>

        <!-- КРУГЛЫЙ ЛОГОТИП СЕТИ С ЖИВЫМ НЕОНОМ -->
        <img src="GRV.png" alt="GRV Логотип" class="brand-logo-img">

        <h1>GRVclarity</h1>
        <div class="subtitle">👑 Премиальный ИИ-Ассистент</div>
        
        <!-- Категории ИИ-ролей, которые символ в символ совпадают со списками в data.json -->
        <select id="aiRole" class="module-select">
            <option value="действуй строго по законам РФ как высококвалифицированный юрист." selected>⚖️ Юриспруденция и Защита прав</option>
            <option value="действуй как эксперт по маркетплейсам Wildberries, Ozon и Яндекс.Маркет.">📦 Маркетплейсы (WB, Ozon, Я.Маркет)</option>
            <option value="действуй как автоэксперт, мастер по подбору машин и специалист по автотехнике.">🚗 Автомобили и техника</option>
            <option value="действуй как профессиональный маркетолог, копирайтер и бизнес-консультант.">💼 Услуги и Бизнес</option>
        </select>

        <!-- Намертво блокируем автозаполнение браузера (autocomplete="off") -->
        <form action="https://google.ru" method="GET" target="_blank" id="aiForm" style="width: 100%;" autocomplete="off">
            <input type="hidden" name="hl" value="ru">
            <input type="hidden" name="udm" value="50">
            
            <div class="input-box">
                <!-- Текстовое поле ввода полностью прозрачное и защищено от выпадающих белых списков браузера -->
                <input type="text" name="q" id="userQuery" placeholder="Опишите вашу проблему или выберите вопрос ниже..." required autocomplete="off">
                <!-- Наша синяя круглая кнопочка со стрелочкой из Авито/Телеграма -->
                <button type="submit" class="send-mini-btn" title="Отправить запрос">➔</button>
            </div>
            
            <!-- Сюда наш движок logic.js красиво выставит 4 динамические кнопки из интернета -->
            <div class="quick-buttons-grid" id="dynamic-buttons-container"></div>
        </form>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ МОДАЛЬНОЕ ОКНО КОШЕЛЬКА (ЛИЧНЫЙ КАБИНЕТ) -->
    <div class="modal-overlay" id="walletModal">
        <div class="modal-content-card">
            <button class="modal-close-xBtn" id="closeWalletBtn">✕</button>
            <h3 class="modal-title">Личный кабинет GRV</h3>
            <!-- Вместо слова "Загрузка..." скрипт вставит уникальный сгенерированный ID пользователя -->
            <div class="user-id-badge">ID: <span id="userStaticID">Загрузка...</span></div>
            
            <div class="modal-balance-section">
                <div class="modal-balance-label">Текущий баланс</div>
                <div class="modal-balance-amount" id="modalBalanceValue">0 ₽</div>
            </div>
            
            <div class="qr-container-box">
                <div class="qr-placeholder-text">Заготовка QR-кода<br><span style="font-size:9px;color:#6b7280;">ссылка для друзей</span></div>
            </div>
            
            <p class="bonus-promo-info-text">🎁 Делитесь вашим личным QR-кодом! Получайте по **100 рублей** за каждую первую оплаченную подписку привлеченного пользователя.</p>
            
            <button class="payout-action-btn" id="requestPayoutBtn">Вывести средства</button>
        </div>
    </div>
    
    <!-- 🔥 ИСПРАВЛЕНО: Чистое и безопасное подключение модулей без конфликтов и грязи -->
    <script src="js/config.js"></script>
    <script src="js/logic.js"></script> <!-- Единый монолитный «мозг» кнопок, кошелька и маскировки -->
</body>
</html>
