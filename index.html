<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSK AI Поиск</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 400px; background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; height: 90vh; }
        h2 { text-align: center; color: #38bdf8; font-size: 1.5rem; font-weight: bold; margin-top: 5px; }
        p { text-align: center; color: #94a3b8; font-size: 0.85rem; }
        textarea { width: 100%; border: 1px solid #334155; border-radius: 12px; background: #0f172a; color: #ffffff; padding: 12px; font-size: 0.95rem; outline: none; resize: none; height: 80px; }
        textarea:focus { border-color: #38bdf8; }
        button { background: #0284c7; color: #ffffff; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; width: 100%; }
        button:active { background: #0369a1; transform: scale(0.98); }
        .output-box { flex: 1; background: #0f172a; border-radius: 12px; padding: 12px; overflow-y: auto; white-space: pre-wrap; font-size: 0.95rem; color: #e2e8f0; border: 1px solid #334155; line-height: 1.4; }
    </style>
</head>
<body>
<div class="container">
    <h2>MSK AI Поиск</h2>
    <p>Задайте любой вопрос или опишите бизнес-задачу</p>
    
    <textarea id="task_input" placeholder="Например: напиши текст для продажи авто или карточку товара..."></textarea>
    <button onclick="sendToNetwork()">Найти решение</button>
    
    <div id="result_output" class="output-box">Поисковая ИИ-сеть готова к работе...</div>
</div>

<script>
async function sendToNetwork() {
    const inputData = document.getElementById('task_input').value.trim();
    const outputBox = document.getElementById('result_output');
    
    if (!inputData) {
        alert("Пожалуйста, введите ваш запрос.");
        return;
    }
    
    outputBox.innerText = "Поиск ответа в закрытой сети... Пожалуйста, подождите...";
    
    try {
        // Прямой надежный GET-запрос к ядру без лишних промптов и блокировок
        const secureGateway = "https://pollinations.ai";
        const finalUrl = secureGateway + encodeURIComponent(inputData + " (Отвечай развернуто, профессионально, строго на русском языке, без лишних приветствий)");
        
        const response = await fetch(finalUrl);
        if (!response.ok) throw new Error();
        
        const textResult = await response.text();
        outputBox.innerText = textResult;
    } catch (e) {
        outputBox.innerText = "Ошибка соединения со шлюзом. Проверьте интернет на устройстве.";
    }
}
</script>
</body>
</html>
