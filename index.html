<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSK AI Network</title>
    <style>
        :root {
            --bg-color: #131314;
            --container-bg: #1e1f20;
            --text-color: #e3e3e3;
            --accent-color: #a8c7fa;
            --input-bg: #2b2a33;
            --btn-active: #333538;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        
        /* Шапка и выбор агентов */
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 20px; font-weight: 500; color: var(--accent-color); }
        .agents-tabs { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .agent-btn { background: var(--container-bg); border: 1px solid #444; color: var(--text-color); padding: 10px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .agent-btn.active { background: var(--accent-color); color: #000; font-weight: 600; border-color: var(--accent-color); }
        
        /* Экран вывода */
        .display-area { flex-grow: 1; background: var(--container-bg); border-radius: 16px; padding: 16px; overflow-y: auto; margin-bottom: 15px; font-size: 15px; line-height: 1.5; border: 1px solid #2d2f31; white-space: pre-wrap; }
        
        /* Утилиты */
        .utility-bar { display: flex; gap: 10px; margin-bottom: 15px; justify-content: flex-end; }
        .util-btn { background: transparent; border: none; color: var(--accent-color); font-size: 13px; cursor: pointer; padding: 5px 10px; border-radius: 4px; }
        .util-btn:active { background: var(--btn-active); }
        
        /* Контейнер ввода */
        .input-container { display: flex; background: var(--input-bg); border-radius: 28px; padding: 6px 12px; align-items: center; border: 1px solid #52525e; }
        .input-container input { flex-grow: 1; background: transparent; border: none; color: var(--text-color); font-size: 16px; padding: 10px; outline: none; }
        .send-btn { background: transparent; border: none; color: var(--accent-color); font-size: 22px; cursor: pointer; padding: 0 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MSK AI Network</h1>
    </div>

    <!-- Переключатели ИИ-Агентов -->
    <div class="agents-tabs">
        <button class="agent-btn active" onclick="selectAgent('search', this)">Общий поиск</button>
        <button class="agent-btn" onclick="selectAgent('lawyer', this)">ИИ-Юрист РФ</button>
        <button class="agent-btn" onclick="selectAgent('wb', this)">Модуль WB</button>
    </div>

    <!-- Окно ответа -->
    <div class="display-area" id="output">Готов к работе. Введите запрос...</div>

    <!-- Кнопки управления -->
    <div class="utility-bar">
        <button class="util-btn" onclick="copyText()">📋 Скопировать</button>
        <button class="util-btn" onclick="shareText()">🔗 Поделиться</button>
    </div>

    <!-- Поле отправки -->
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Спросите ИИ..." onkeydown="if(event.key === 'Enter') sendToAppInventor()">
        <button class="send-btn" onclick="sendToAppInventor()">➔</button>
    </div>

    <script>
        let currentAgent = "search";

        function selectAgent(agent, element) {
            currentAgent = agent;
            document.querySelectorAll('.agent-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        // Отправка данных через мост WebViewString
        function sendToAppInventor() {
            const inputEl = document.getElementById('userInput');
            const rawText = inputEl.value.trim();
            if (!rawText) return;

            document.getElementById('output').innerText = "В обработке смартфоном...";

            // Формируем payload: Агент + маркер разделения + Текст запроса
            const payload = currentAgent + ":::" + rawText;

            // Передача в App Inventor
            if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString(payload);
            } else {
                // Локальная отладка в браузере, если мост недоступен
                document.getElementById('output').innerText = "Ошибка: Запущено вне App Inventor.\nPayload: " + payload;
            }

            // Мгновенная очистка поля ввода до нуля
            inputEl.value = "";
        }

        // Прием ответа от App Inventor (вызывается автоматически при изменении WebViewString из блоков)
        function receiveFromAppInventor(responseText) {
            document.getElementById('output').innerText = responseText;
        }

        // Периодический опрос WebViewString (на случай, если метод обратного вызова не сработал напрямую)
        setInterval(classCheck, 200);
        let lastString = "";
        function classCheck() {
            if (window.AppInventor && window.AppInventor.getWebViewString) {
                let currentStr = window.AppInventor.getWebViewString();
                if (currentStr.startsWith("RESPONSE:::")) {
                    let cleanResponse = currentStr.replace("RESPONSE:::", "");
                    receiveFromAppInventor(cleanResponse);
                    window.AppInventor.setWebViewString(""); // Сброс буфера
                }
            }
        }

        // Вспомогательные функции
        function copyText() {
            const text = document.getElementById('output').innerText;
            navigator.clipboard.writeText(text);
        }

        function shareText() {
            const text = document.getElementById('output').innerText;
            if (navigator.share) {
                navigator.share({ title: 'MSK AI Network', text: text });
            }
        }
    </script>
</body>
</html>
