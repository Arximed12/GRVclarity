<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSK AI Network Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 400px; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
        .hidden { display: none !important; }
        h2 { text-align: center; color: #38bdf8; font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }
        p { text-align: center; color: #94a3b8; font-size: 0.9rem; line-height: 1.4; }
        input, textarea { width: 100%; border: 1px solid #334155; border-radius: 12px; background: #0f172a; color: #ffffff; padding: 14px; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { background: #0284c7; color: #ffffff; border: none; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; width: 100%; }
        button:active { background: #0369a1; transform: scale(0.98); }
        .output-box { height: 220px; background: #0f172a; border-radius: 12px; padding: 14px; overflow-y: auto; white-space: pre-wrap; font-size: 0.95rem; color: #e2e8f0; border: 1px solid #334155; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container" id="main_card">
    <!-- СТАРТОВЫЙ ЭКРАН ВВОДА КЛЮЧА -->
    <div id="auth_block" style="display: flex; flex-direction: column; gap: 15px;">
        <h2>MSK AI Network</h2>
        <p>Активация доступа к закрытой сети г. Москва.<br>Введите ваш лицензионный ключ подписки:</p>
        <input type="text" id="user_key" placeholder="Формат: MSK-PRO-XXXX" autocomplete="off">
        <button onclick="verifyAccess()">Активировать доступ</button>
        <div id="error_msg" style="color: #f87171; text-align: center; font-weight: bold; font-size: 0.9rem;"></div>
    </div>

    <!-- РАБОЧИЙ ИНТЕРФЕЙС ИИ -->
    <div id="work_block" class="hidden" style="display: flex; flex-direction: column; gap: 15px;">
        <h2>Сеть Москва: Активна</h2>
        <p>Выделенный канал обхода блокировок</p>
        <textarea id="task_input" placeholder="Введите задачу для ИИ (например: текст для Авито)..." style="height: 90px; resize: none;"></textarea>
        <button onclick="sendToNetwork()">Обработать данные</button>
        <div id="result_output" class="output-box">Ожидание входящей задачи...</div>
    </div>
</div>

<script>
const MASTER_KEY = "MSK-PRO-2026";

function verifyAccess() {
    const enteredKey = document.getElementById('user_key').value.trim();
    const errorMsg = document.getElementById('error_msg');
    
    if (enteredKey === MASTER_KEY) {
        document.getElementById('auth_block').classList.add('hidden');
        document.getElementById('work_block').classList.remove('hidden');
    } else {
        errorMsg.innerText = "Ошибка: Ключ подписки недействителен!";
    }
}

async function sendToNetwork() {
    const inputData = document.getElementById('task_input').value.trim();
    const outputBox = document.getElementById('result_output');
    
    if (!inputData) {
        alert("Пожалуйста, введите текст задачи.");
        return;
    }
    
    outputBox.innerText = "Скрытая отправка на сервер в Москве... Вычисление...";
    
    try {
        const secureGateway = "https://pollinations.ai";
        const systemPrompt = " Отвечай строго на русском языке, как эксперт в маркетинге, без приветствий и лишней воды.";
        
        const response = await fetch(secureGateway, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                messages: [{ role: "user", content: inputData + systemPrompt }] 
            })
        });
        
        if (!response.ok) throw new Error();
        const textResult = await response.text();
        outputBox.innerText = textResult;
    } catch (e) {
        outputBox.innerText = "Ошибка соединения с московским узлом сети. Проверьте интернет.";
    }
}
</script>

</body>
</html>
