<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            background-color: #0b0f19; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            padding: 20px; 
            margin: 0;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100vh;
        }
        h2 { color: #818cf8; font-size: 20px; margin-bottom: 15px; }
        .input-box {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 20px;
            padding: 10px 15px;
            width: 100%;
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 14px;
        }
        button {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>⚖️ MSK AI ЮРИСТ</h2>
        
        <!-- Форма вызывает ИИ прямо внутри этой же боковой панели (target="_self") -->
        <form action="https://google.ru" method="GET" target="_self">
            <input type="hidden" name="hl" value="ru">
            <input type="hidden" name="udm" value="50">
            
            <div class="input-box">
                <input type="text" name="q" placeholder="Опишите проблему юристу..." required>
            </div>
            
            <button type="submit">Запустить ИИ-Анализ</button>
        </form>
    </div>

</body>
</html>
