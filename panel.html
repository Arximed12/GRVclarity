<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MSK AI Юрист</title>
    <style>
        /* Задаем фиксированные размеры премиум-окна плагина */
        html, body {
            margin: 0;
            padding: 0;
            width: 800px;  /* Широкое удобное окно по центру */
            height: 600px; /* Оптимальная высота для чата */
            background-color: #0b0f19;
            overflow: hidden;
        }
        /* Встраиваем живой Google Gemini на весь экран окна расширения */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Загружаем официальный ИИ-чат Google прямо внутрь плагина -->
    <iframe src="https://google.com"></iframe>

</body>
</html>
